<!doctype html>
<!-- =============================================================================
     The lecturer's inbox: the students' questions from every course in one place, open
     ones first. The lecturer can answer each one in writing or mark it done.
     ============================================================================= -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="supported-color-schemes" content="light dark" />
    <meta name="theme-color" content="#F3F0E8" />
    <meta name="darkreader-lock" />
    <title>Inbox</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&family=Heebo:wght@400;500;600;700;800;900&family=Frank+Ruhl+Libre:wght@400;500;700&display=swap"
    />
    <link rel="stylesheet" href="../css/style.css?v=7.0" />
    <script src="../js/i18n-strings.js?v=7.0"></script>
    <script src="../js/i18n.js?v=7.0"></script>
    <link rel="expect" href="#page-end" blocking="render" />
  </head>
  <body>
    <script>
      // =============================================================================
      // Runs before anything is drawn. When the person arrives from (or goes into) the live
      // room, the curtain sheet is still covering the screen, so it is put back right away
      // and the page never flashes in between. See js/curtain.js.
      // =============================================================================
      try {
        var cpO = JSON.parse(sessionStorage.getItem("cp.curtain") || "null"),
          cpN = (performance.getEntriesByType("navigation")[0] || {}).type,
          cpD = document.body.classList.contains("dark-screen");
        sessionStorage.removeItem("cp.curtain");
        if (
          !cpO &&
          cpN === "back_forward" &&
          cpD !== (sessionStorage.getItem("cp.fromDark") === "1")
        )
          cpO = { dir: "back", color: "blue" };
        if (cpO) {
          var cpC = document.createElement("div");
          cpC.className =
            "curtain " +
            (cpO.color === "ink" ? "ink" : "blue") +
            (cpO.dir === "back" ? " edge-left" : " edge-right");
          cpC.setAttribute("aria-hidden", "true");
          cpC.dataset.dir = cpO.dir;
          cpC.dataset.mode = "slide";
          document.body.prepend(cpC);
        }
      } catch (e) {}
    </script>
    <div id="topbar"></div>
    <main class="container">
      <header class="page-head">
        <div>
          <span class="kicker" id="kicker">&nbsp;</span>
          <h1 class="page-title">
            The <span class="serif"><span class="hl">inbox.</span></span>
          </h1>
        </div>
        <div
          class="row"
          style="gap: 8px"
          role="group"
          aria-label="Show"
          id="show"
        >
          <button
            type="button"
            class="btn btn-pill"
            data-show="open"
            aria-pressed="true"
          >
            Open
          </button>
          <button
            type="button"
            class="btn btn-pill"
            data-show="answered"
            aria-pressed="false"
          >
            Answered
          </button>
          <button
            type="button"
            class="btn btn-pill"
            data-show="all"
            aria-pressed="false"
          >
            All
          </button>
        </div>
      </header>
      <div id="list" style="max-width: 900px"></div>
    </main>
    <script src="../js/config.js?v=7.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/api-supabase.js?v=7.0"></script>
    <script src="../js/ui.js?v=7.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
    <script src="../js/curtain.js?v=7.0"></script>
    <script src="../js/motion.js?v=7.0"></script>
    <script>
      // =============================================================================
      // The inbox page's code.
      // =============================================================================
      (async () => {
        const me = renderTopbar("inbox");
        let show = "open",
          items = [],
          editing = null;

        // =============================================================================
        // A question counts as done when it was marked answered or got a written answer.
        // =============================================================================
        const isDone = (q) => !!(q.answered || q.reply);

        // =============================================================================
        // Draws the questions (open, answered or all), each with its course and its answer
        // box.
        // =============================================================================
        function draw() {
          const open = items.filter((x) => !isDone(x.q)).length;
          setText($("#kicker"), `Questions from every course · ${open} open`);
          const rows = items.filter(
            (x) => show === "all" || (show === "answered") === isDone(x.q),
          );
          setHTML(
            $("#list"),
            rows.length
              ? rows
                  .map(
                    ({ q, c }) => `
      <article class="q-item">
        <span class="vote-btn" style="cursor:default" aria-label="${q.votes} vote${q.votes === 1 ? "" : "s"}">${icon("up", 14, "currentColor", 2.4)}<span>${q.votes}</span></span>
        <div style="flex:1;min-width:0">
          <p class="q-text" dir="auto">${questionTextHTML(q.text)}</p>
          <p class="mono muted q-meta" style="font-size:10px"><a href="questions.html?course=${c.code}" style="color:inherit">${esc(c.name)}</a> · ${esc(q.author)} · ${fmtDate(q.createdAt)} ${fmtTime(q.createdAt).slice(0, 5)}</p>
          ${
            editing === q.id
              ? `<form class="reply-form" data-reply="${q.id}">
              <label class="sr-only" for="r-${q.id}">Your answer</label>
              <textarea id="r-${q.id}" class="input" rows="3" maxlength="1000" dir="auto" placeholder="Write your answer. Students see it under the question.">${esc(q.reply || "")}</textarea>
              <div class="row" style="gap:8px;justify-content:flex-end"><button type="button" class="btn" data-cancel>Cancel</button><button class="btn btn-primary">${q.reply ? "Save answer" : "Send answer"}</button></div></form>`
              : q.reply
                ? `<div class="reply"><span class="reply-head">You replied</span><p class="reply-text" dir="auto">${esc(q.reply)}</p></div>`
                : ""
          }
          ${
            editing === q.id
              ? ""
              : `<div class="row wrap" style="gap:8px;margin-top:14px">
            <button class="btn ${q.reply ? "" : "btn-primary"}" data-edit="${q.id}">${q.reply ? "Edit answer" : "Answer"}</button>
            ${q.reply ? "" : `<button class="btn" data-done="${q.id}" data-val="${!q.answered}">${q.answered ? "Reopen" : "Answered in class"}</button>`}</div>`
          }
        </div>
      </article>`,
                  )
                  .join("")
              : `<p class="serif muted" style="font-size:26px;padding:20px 0;border-top:1px solid var(--line)">${items.length ? (show === "open" ? "Inbox zero. Every question is answered." : "Nothing here.") : "No questions yet. When students ask something, it lands here."}</p>`,
          );
        }
        $("#show").addEventListener("click", (e) => {
          const b = e.target.closest("[data-show]");
          if (!b) return;
          show = b.dataset.show;
          $all("#show [data-show]").forEach((x) =>
            x.setAttribute("aria-pressed", x === b),
          );
          draw();
        });

        // =============================================================================
        // The buttons on a question: open or close the answer box, or mark it done.
        // =============================================================================
        $("#list").addEventListener("click", async (e) => {
          const ed = e.target.closest("[data-edit]"),
            cancel = e.target.closest("[data-cancel]"),
            done = e.target.closest("[data-done]");
          if (ed) {
            editing = ed.dataset.edit;
            draw();
            $(`#r-${editing}`)?.focus();
          }
          if (cancel) {
            editing = null;
            draw();
          }
          if (done) {
            done.disabled = true;
            await API.setCommentState(done.dataset.done, {
              answered: done.dataset.val === "true",
            });
            toast(
              done.dataset.val === "true" ? "Marked as answered" : "Reopened",
            );
            render();
          }
        });

        // =============================================================================
        // Sends a written answer.
        // =============================================================================
        $("#list").addEventListener("submit", async (e) => {
          const f = e.target.closest("[data-reply]");
          if (!f) return;
          e.preventDefault();
          const text = f.querySelector("textarea").value.trim();
          if (!text) return toast("Write the answer first");
          f.querySelector(".btn-primary").disabled = true;
          await API.replyComment(f.dataset.reply, text);
          editing = null;
          toast("Answer sent");
          render();
        });

        // =============================================================================
        // In the answer box, Ctrl/Cmd + Enter sends and Esc closes.
        // =============================================================================
        $("#list").addEventListener("keydown", (e) => {
          if (!e.target.closest(".reply-form")) return;
          if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
            e.preventDefault();
            e.target.form.requestSubmit();
          }
          if (e.key === "Escape") {
            editing = null;
            draw();
          }
        });

        // =============================================================================
        // Loads the questions of all the lecturer's courses and draws them.
        // =============================================================================
        async function render() {
          const courses = await API.listCourses();
          const lists = await Promise.all(
            courses.map(async (c) =>
              ((await API.listComments(c.id, me.email)) || []).map((q) => ({
                q,
                c: { code: c.code, name: c.name },
              })),
            ),
          );
          items = lists
            .flat()
            .sort(
              (a, b) =>
                isDone(a.q) - isDone(b.q) ||
                b.q.votes - a.q.votes ||
                b.q.createdAt - a.q.createdAt,
            );
          cacheSet("inbox", items);
          if (editing && document.activeElement?.closest?.(".reply-form"))
            return;
          draw();
        }

        // =============================================================================
        // Shows what this tab saw last time, then loads fresh data and keeps refreshing.
        // =============================================================================
        const cached = cacheGet("inbox");
        if (cached) {
          items = cached;
          draw();
          bootDone();
        }
        render();
        API.onChange(render);
      })();
    </script>
    <span id="page-end" hidden></span>
  </body>
</html>
