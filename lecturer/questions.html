<!doctype html>
<!-- =============================================================================
     A course's questions on the lecturer's side: every question the students asked, most
     upvoted first. The lecturer answers in writing, marks questions answered, or removes
     an answer.
     ============================================================================= -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="supported-color-schemes" content="light dark" />
    <meta name="theme-color" content="#F3F0E8" />
    <meta name="darkreader-lock" />
    <title>Questions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&family=Heebo:wght@400;500;600;700;800;900&family=Frank+Ruhl+Libre:wght@400;500;700&display=swap"
    />
    <link rel="stylesheet" href="../css/style.css?v=7.0" />
    <script src="../js/i18n-strings.js?v=7.0"></script>
    <script src="../js/i18n.js?v=7.0"></script>
    <link rel="expect" href="#page-end" blocking="render" />
  </head>
  <body>
    <script>
      // =============================================================================
      // Runs before anything is drawn. When the person arrives from (or goes into) the live
      // room, the curtain sheet is still covering the screen, so it is put back right away
      // and the page never flashes in between. See js/curtain.js.
      // =============================================================================
      try {
        var cpO = JSON.parse(sessionStorage.getItem("cp.curtain") || "null"),
          cpN = (performance.getEntriesByType("navigation")[0] || {}).type,
          cpD = document.body.classList.contains("dark-screen");
        sessionStorage.removeItem("cp.curtain");
        if (
          !cpO &&
          cpN === "back_forward" &&
          cpD !== (sessionStorage.getItem("cp.fromDark") === "1")
        )
          cpO = { dir: "back", color: "blue" };
        if (cpO) {
          var cpC = document.createElement("div");
          cpC.className =
            "curtain " +
            (cpO.color === "ink" ? "ink" : "blue") +
            (cpO.dir === "back" ? " edge-left" : " edge-right");
          cpC.setAttribute("aria-hidden", "true");
          cpC.dataset.dir = cpO.dir;
          cpC.dataset.mode = "slide";
          document.body.prepend(cpC);
        }
      } catch (e) {}
    </script>
    <div id="topbar"></div>
    <main class="container">
      <div id="course-head" data-tab="questions"></div>

      <div
        class="row wrap"
        style="justify-content: space-between; align-items: center"
      >
        <div>
          <h2 class="section-title">Questions and comments</h2>
          <p class="small muted" style="margin-top: 4px">
            Students send these from the course page, during a lecture or any
            time after it.
          </p>
        </div>
        <div
          class="seg"
          style="grid-template-columns: repeat(3, auto)"
          role="group"
          aria-label="Show"
        >
          <button
            type="button"
            data-show="open"
            aria-pressed="true"
            style="padding: 0 16px"
          >
            Open
          </button>
          <button
            type="button"
            data-show="answered"
            aria-pressed="false"
            style="padding: 0 16px"
          >
            Answered
          </button>
          <button
            type="button"
            data-show="all"
            aria-pressed="false"
            style="padding: 0 16px"
          >
            All
          </button>
        </div>
      </div>

      <section class="table-card">
        <div class="table-head">
          <h3 style="font-size: 17px" id="q-count">&nbsp;</h3>
        </div>
        <div id="q-list"></div>
      </section>
    </main>

    <script src="../js/config.js?v=7.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/api-supabase.js?v=7.0"></script>
    <script src="../js/ui.js?v=7.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
    <script src="../js/curtain.js?v=7.0"></script>
    <script src="../js/motion.js?v=7.0"></script>
    <script>
      // =============================================================================
      // The course questions page's code.
      // =============================================================================
      (async () => {
        const me = (renderTopbar(), API.getSession());
        const course = await getCourse();
        if (!course) {
          location.replace("courses.html");
          return;
        }

        // =============================================================================
        // Which questions to show (open, answered or all), the questions themselves, and which
        // question's answer box is open.
        // =============================================================================
        let show = "open",
          list = [],
          editing = null;

        // =============================================================================
        // Draws the questions with their votes, their slide (if they are about one), and the
        // answer box.
        // =============================================================================
        function draw() {
          const open = list.filter((c) => !c.answered).length;
          setText(
            $("#q-count"),
            list.length
              ? `${open} open, ${list.length - open} answered`
              : "No questions yet",
          );
          const rows = list.filter(
            (c) => show === "all" || (show === "open") === !c.answered,
          );
          setHTML(
            $("#q-list"),
            rows.length
              ? rows
                  .map(
                    (c) => `
      <div class="session-row" style="align-items:flex-start">
        <div class="session-date" title="Votes from students"><b>${c.votes}</b><span>vote${c.votes === 1 ? "" : "s"}</span></div>
        <div style="flex:1 1 260px; min-width:0">
          <p style="font-size:var(--fs-md); line-height:1.4" dir="auto">${questionTextHTML(c.text, { button: false })}</p>
          <p class="small muted" style="margin-top:4px" dir="auto">${esc(c.author)}, ${fmtDate(c.createdAt)} ${fmtTime(c.createdAt).slice(0, 5)}</p>
          ${
            editing === c.id
              ? `
            <form class="reply-form" data-reply-form="${c.id}">
              <label class="sr-only" for="reply-${c.id}">Your answer</label>
              <textarea id="reply-${c.id}" class="input" rows="3" maxlength="1000" dir="auto" placeholder="Write your answer. Students see it under the question.">${esc(c.reply || "")}</textarea>
              <div class="row" style="gap:8px; justify-content:flex-end">
                ${c.reply ? `<button type="button" class="btn btn-danger" data-remove-reply="${c.id}">Remove answer</button>` : ""}
                <button type="button" class="btn" data-cancel>Cancel</button>
                <button class="btn btn-primary">${c.reply ? "Save answer" : "Send answer"}</button>
              </div>
            </form>`
              : c.reply
                ? `<div class="reply"><p class="small" style="font-weight:600">Your answer</p><p dir="auto">${esc(c.reply)}</p></div>`
                : ""
          }
        </div>
        <div class="row" style="gap:8px">
          ${c.answered ? '<span class="chip ok">Answered</span>' : ""}
          ${editing === c.id ? "" : `<button class="btn ${c.reply ? "" : "btn-primary"}" data-edit="${c.id}">${c.reply ? "Edit answer" : "Answer"}</button>`}
          ${c.reply ? "" : `<button class="btn" data-answer="${c.id}" data-val="${!c.answered}">${c.answered ? "Reopen" : "Mark answered"}</button>`}
          <button class="btn btn-danger" data-hide="${c.id}">Hide</button>
        </div>
      </div>`,
                  )
                  .join("")
              : `<p class="muted" style="padding:20px">${
                  !list.length
                    ? "Nothing here yet. When a student asks something, it shows up on this page."
                    : show === "open"
                      ? "Every question is answered."
                      : "No answered questions yet."
                }</p>`,
          );
        }

        // =============================================================================
        // Loads the course's questions and draws them.
        // =============================================================================
        async function render() {
          list = await API.listComments(course.id, me.email);
          if (editing && document.activeElement?.closest?.(".reply-form"))
            return;
          draw();
        }

        // =============================================================================
        // One listener for the whole list, so it keeps working after a redraw: open or close
        // an answer box, remove an answer, mark answered.
        // =============================================================================
        $("#q-list").addEventListener("click", async (e) => {
          const ed = e.target.closest("[data-edit]"),
            cancel = e.target.closest("[data-cancel]"),
            rm = e.target.closest("[data-remove-reply]");
          if (ed) {
            editing = ed.dataset.edit;
            draw();
            const t = $(`#reply-${editing}`);
            t?.focus();
            t?.setSelectionRange(t.value.length, t.value.length);
            return;
          }
          if (cancel) {
            editing = null;
            draw();
            return;
          }
          if (rm) {
            rm.disabled = true;
            await API.replyComment(rm.dataset.removeReply, "");
            editing = null;
            toast("Answer removed");
            return render();
          }
          const a = e.target.closest("[data-answer]"),
            h = e.target.closest("[data-hide]");
          if (a) {
            a.disabled = true;
            await API.setCommentState(a.dataset.answer, {
              answered: a.dataset.val === "true",
            });
            toast(a.dataset.val === "true" ? "Marked as answered" : "Reopened");
            render();
          }
          if (
            h &&
            (await ask({
              title: "Hide this message?",
              message:
                "Nobody will see it any more, students included. This can't be undone.",
              confirm: "Hide message",
              danger: true,
            }))
          ) {
            h.disabled = true;
            await API.setCommentState(h.dataset.hide, { hidden: true });
            toast("Message hidden");
            render();
          }
        });

        // =============================================================================
        // Sends a written answer.
        // =============================================================================
        $("#q-list").addEventListener("submit", async (e) => {
          const f = e.target.closest("[data-reply-form]");
          if (!f) return;
          e.preventDefault();
          const text = f.querySelector("textarea").value.trim();
          if (!text) return toast("Write the answer first");
          f.querySelector(".btn-primary").disabled = true;
          await API.replyComment(f.dataset.replyForm, text);
          editing = null;
          toast("Answer sent. Students see it under the question.");
          render();
        });

        // =============================================================================
        // In the answer box, Ctrl/Cmd + Enter sends and Esc closes.
        // =============================================================================
        $("#q-list").addEventListener("keydown", (e) => {
          if (!e.target.closest(".reply-form")) return;
          if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
            e.preventDefault();
            e.target.form.requestSubmit();
          }
          if (e.key === "Escape") {
            editing = null;
            draw();
          }
        });

        // =============================================================================
        // The Open / Answered / All buttons.
        // =============================================================================
        $all("[data-show]").forEach((b) =>
          b.addEventListener("click", () => {
            show = b.dataset.show;
            $all("[data-show]").forEach((x) =>
              x.setAttribute("aria-pressed", x === b),
            );
            draw();
          }),
        );

        render();
        API.onChange(render);
      })();
    </script>
    <span id="page-end" hidden></span>
  </body>
</html>
