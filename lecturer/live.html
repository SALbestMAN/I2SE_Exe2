            slide,
            $("#deck-canvas"),
            box.width,
            Math.max(240, box.height),
          ).catch(() => {});
          deckPen.redraw();
        }

        // =============================================================================
        // A question that names a slide: clicking it opens the slides on that page.
        // =============================================================================
        $("#qlist").addEventListener("click", (e) => {
          const b = e.target.closest("[data-goto-slide]");
          if (!b) return;
          if (!deckDoc) return toast("No slides are open");
          $('[data-view="slides"]').click();
          goSlide(Number(b.dataset.gotoSlide));
        });

        // =============================================================================
        // Goes to slide n, here and on the students' phones.
        // =============================================================================
        function goSlide(n) {
          if (!deckDoc) return;
          const next = Math.max(1, Math.min(deckDoc.numPages, n));
          if (next === slide) return;
          slide = next;
          deckPen.newPage();
          drawSlide();
          clearTimeout(slideTimer);
          slideTimer = setTimeout(
            () => deck?.path && API.setSlide(sid, slide).catch(() => {}),
            250,
          );
        }

        // =============================================================================
        // Pictures become one PDF (one picture per page), so they can be drawn on and followed
        // like slides.
        // =============================================================================
        async function imagesToPDF(files) {
          const { PDFDocument } = await Files.pdfWriter();
          const pdf = await PDFDocument.create();
          for (const f of files) {
            let bytes = new Uint8Array(await f.arrayBuffer()),
              png = /png$/i.test(f.type) || /\.png$/i.test(f.name);
            if (!png && !/jpe?g$/i.test(f.type) && !/\.jpe?g$/i.test(f.name)) {
              const bmp = await createImageBitmap(f),
                c = document.createElement("canvas");
              c.width = bmp.width;
              c.height = bmp.height;
              c.getContext("2d").drawImage(bmp, 0, 0);
              bytes = new Uint8Array(
                await (
                  await new Promise((r) => c.toBlob(r, "image/png"))
                ).arrayBuffer(),
              );
              png = true;
            }
            const img = png
              ? await pdf.embedPng(bytes)
              : await pdf.embedJpg(bytes);
            pdf
              .addPage([img.width, img.height])
              .drawImage(img, {
                x: 0,
                y: 0,
                width: img.width,
                height: img.height,
              });
          }
          return new File(
            [await pdf.save()],
            (files.length > 1
              ? "Pictures"
              : files[0].name.replace(/\.\w+$/, "")) + ".pdf",
            { type: "application/pdf" },
          );
        }
        $("#deck-file").setAttribute("multiple", "");

        // =============================================================================
        // Uploads the slides the lecturer picked (a PDF, pictures, or an Office file) and
        // shows them.
        // =============================================================================
        $("#deck-file").addEventListener("change", async (e) => {
          let files = [...e.target.files];
          e.target.value = "";
          if (!files.length) return;
          let f = files[0];
          if (files.every(isImage)) {
            try {
              f = await imagesToPDF(files);
            } catch (err) {
              return toast("These pictures couldn't be opened");
            }
          } else if (files.length > 1)
            return toast("Choose one file (or several pictures)");
          const office = isOffice(f.name),
            pdf = /\.pdf$/i.test(f.name) || f.type === "application/pdf";
          if (!office && !pdf)
            return toast(
              "Use a PDF, PowerPoint, Word or Excel file, or pictures",
            );
          let doc = null;
          if (pdf) {
            try {
              deckBytes = await f.arrayBuffer();
              doc = await Files.openPDF(new Blob([deckBytes]));
            } catch (err) {
              return toast("This PDF couldn't be opened");
            }
          }
          await showDeck(doc, {
            name: f.name,
            slide: 1,
            kind: office ? "office" : "pdf",
            pages: doc?.numPages || 1,
          });
          setText(
            $("#deck-sync"),
            office
              ? "Uploading (the viewer needs it online)…"
              : "Sending to students…",
          );
          try {
            const path = await API.uploadDeck(
              deckSession,
              f,
              doc?.numPages || 1,
              office ? "office" : "pdf",
            );
            deck = { ...deck, path };
            if (office) {
              deck.url = await API.deckURL(path, 6 * 3600);
              $("#deck-office").src = officeViewer(deck.url);
            }
            setText($("#deck-sync"), "● On students' phones");
            if (slide > 1) API.setSlide(sid, slide).catch(() => {});
          } catch (err) {
            setText($("#deck-sync"), "Not sent: " + err.message);
          }
        });
        $("#deck-prev").addEventListener("click", () => goSlide(slide - 1));
        $("#deck-next").addEventListener("click", () => goSlide(slide + 1));
        $("#deck-back").addEventListener("click", () => goSlide(slide - 1));
        $("#deck-fwd").addEventListener("click", () => goSlide(slide + 1));

        // =============================================================================
        // Switches an element in or out of full screen.
        // =============================================================================
        const fullscreen = (el) =>
          (document.fullscreenElement
            ? document.exitFullscreen()
            : el.requestFullscreen?.()
          )?.catch?.(() => {});
        $("#deck-full").addEventListener("click", () =>
          fullscreen($("#deck-view")),
        );

        // =============================================================================
        // Updates the full-screen buttons when full screen turns on or off.
        // =============================================================================
        document.addEventListener("fullscreenchange", () => {
          const on = !!document.fullscreenElement;
          setText($("#deck-full"), on ? "Exit full screen" : "Full screen");
          setText($("#board-full"), on ? "Exit full screen" : "Full screen");
          setTimeout(() => {
            drawSlide();
            boardPen.redraw();
          }, 60);
        });
        addEventListener("resize", () => {
          clearTimeout(drawSlide.t);
          drawSlide.t = setTimeout(() => {
            drawSlide();
            boardPen.redraw();
          }, 120);
        });

        // =============================================================================
        // Keyboard on the projector: the arrows, Page Up/Down, Space, Home and End move
        // between slides or board pages, and Ctrl/Cmd + Z undoes the last drawing.
        // =============================================================================
        addEventListener("keydown", (e) => {
          if (e.target.closest("input, textarea, select, dialog")) return;
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") {
            if (view === "slides") {
              e.preventDefault();
              deckPen.undo();
            } else if (view === "board") {
              e.preventDefault();
              boardPen.undo();
            }
            return;
          }
          if (view === "board") {
            const k = { ArrowRight: 1, PageDown: 1, ArrowLeft: -1, PageUp: -1 }[
              e.key
            ];
            if (k) {
              e.preventDefault();
              goBoard(boardPage + k);
            }
            return;
          }
          if (view !== "slides" || !deckDoc) return;
          const k = {
            ArrowRight: 1,
            ArrowDown: 1,
            PageDown: 1,
            " ": 1,
            ArrowLeft: -1,
            ArrowUp: -1,
            PageUp: -1,
          }[e.key];
          if (k) {
            e.preventDefault();
            goSlide(slide + k);
          } else if (e.key === "Home") goSlide(1);
          else if (e.key === "End") goSlide(deckDoc.numPages);
        });

        // =============================================================================
        // Removes the slides (from the students' phones too) and their drawings.
        // =============================================================================
        $("#deck-remove").addEventListener("click", async () => {
          if (
            !(await ask({
              title: "Remove the slides?",
              message:
                "They disappear from the students' phones too, and your drawings on them are deleted.",
              confirm: "Remove slides",
              danger: true,
            }))
          )
            return;
          hideDeck();
          delete ink.deck;
          saveInk();
          await API.removeDeck(deckSession).catch(() => {});
        });
        if (session.deck?.path) {
          // =============================================================================
          // When the lecture already had slides (for example after a reload), shows them again.
          // =============================================================================
          (async () => {
            try {
              const office = session.deck.kind === "office";
              const url = await API.deckURL(
                session.deck.path,
                office ? 6 * 3600 : 3600,
              );
              if (office) return showDeck(null, { ...session.deck, url });
              deckBytes = await (await fetch(url)).arrayBuffer();
              await showDeck(
                await Files.openPDF(new Blob([deckBytes])),
                session.deck,
              );
              setText($("#deck-sync"), "● On students' phones");
            } catch (e) {}
          })();
        }

        // =============================================================================
        // Whiteboard: the page now showing.
        // =============================================================================
        let boardPage = 0;
        const boardPen = Ink.attach($("#board-ink"), {
          items: () => ink.board[boardPage],
          changed: saveInk,
        });
        Ink.toolbar($("#board-tools"), boardPen, {
          dark: true,
          withNone: false,
        });
        boardPen.setTool("pen");
        $('#board-tools [data-t="pen"]').setAttribute("aria-pressed", "true");

        // =============================================================================
        // Goes to whiteboard page n.
        // =============================================================================
        function goBoard(n) {
          boardPage = Math.max(0, Math.min(ink.board.length - 1, n));
          setText($("#board-count"), `${boardPage + 1} / ${ink.board.length}`);
          boardPen.newPage();
        }
        $("#board-back").addEventListener("click", () =>
          goBoard(boardPage - 1),
        );
        $("#board-fwd").addEventListener("click", () => goBoard(boardPage + 1));
        $("#board-add").addEventListener("click", () => {
          ink.board.push([]);
          saveInk();
          goBoard(ink.board.length - 1);
        });
        $("#board-full").addEventListener("click", () =>
          fullscreen($('[data-panel="board"]')),
        );
        goBoard(0);

        // =============================================================================
        // Opening the slides or the board tab also redraws it at its new size.
        // =============================================================================
        const origSetView = setView;
        setView = (v) => {
          origSetView(v);
          if (v === "slides") requestAnimationFrame(drawSlide);
          if (v === "board") requestAnimationFrame(boardPen.redraw);
        };

        // =============================================================================
        // How many slides have drawings on them.
        // =============================================================================
        const pagesWithInk = () =>
          Object.values(
            ink.deck?.key === deckKey() ? ink.deck.pages : {},
          ).filter((p) => p.length).length;

        // =============================================================================
        // How many whiteboard pages have something on them.
        // =============================================================================
        const boardUsed = () => ink.board.filter((p) => p.length).length;

        // =============================================================================
        // The slides PDF with the drawings stamped onto each page.
        // =============================================================================
        async function deckWithInk() {
          if (!deckBytes)
            deckBytes = await (
              await fetch(await API.deckURL(deck.path))
            ).arrayBuffer();
          const { PDFDocument } = await Files.pdfWriter();
          const pdf = await PDFDocument.load(deckBytes.slice(0), {
            ignoreEncryption: true,
          });
          const pages = pdf.getPages();
          const drawn = Object.entries(
            ink.deck?.key === deckKey() ? ink.deck.pages : {},
          ).filter(([, items]) => items.length);
          let k = 0;
          for (const [n, items] of drawn) {
            const page = pages[+n - 1];
            if (!page) continue;
            setText(
              $("#end-note"),
              `Putting your drawings on the slides: ${++k} of ${drawn.length}…`,
            );
            const { width, height } = page.getSize();
            const scale = Math.min(2, 2400 / Math.max(width, height));
            const png = await Ink.toPNG(
              items,
              Math.max(1, Math.round(width * scale)),
              Math.max(1, Math.round(height * scale)),
            );
            if (!png)
              throw new Error("a drawing couldn't be turned into a picture");
            const img = await pdf.embedPng(
              new Uint8Array(await png.arrayBuffer()),
            );
            page.drawImage(img, { x: 0, y: 0, width, height });
          }
          setText($("#end-note"), "Saving the PDF…");
          return new Blob([await pdf.save()], { type: "application/pdf" });
        }

        // =============================================================================
        // The whiteboard pages as one PDF.
        // =============================================================================
        async function boardPDF() {
          const { PDFDocument, rgb } = await Files.pdfWriter();
          const pdf = await PDFDocument.create(),
            W = 1280,
            H = 720;
          for (const items of ink.board.filter((p) => p.length)) {
            const page = pdf.addPage([W, H]);
            page.drawRectangle({
              x: 0,
              y: 0,
              width: W,
              height: H,
              color: rgb(0.984, 0.98, 0.965),
            });
            const png = await Ink.toPNG(items, W * 2, H * 2);
            page.drawImage(
              await pdf.embedPng(new Uint8Array(await png.arrayBuffer())),
              { x: 0, y: 0, width: W, height: H },
            );
          }
          return new Blob([await pdf.save()], { type: "application/pdf" });
        }

        // =============================================================================
        // The name used for saved files, like "Software Engineering - Lecture 6".
        // =============================================================================
        const lectureName = () =>
          `${course.name} - Lecture ${session.number || ""}`.trim();

        // =============================================================================
        // "End lecture": opens the window that asks what to keep.
        // =============================================================================
        $("#end-btn").addEventListener("click", () => {
          const dlg = $("#end-dlg");
          const hasDeck = !!deck?.path || !!deckDoc,
            office = deck?.kind === "office",
            drawn = pagesWithInk(),
            used = boardUsed();
          $("#end-slides").classList.toggle("hidden", !hasDeck);
          setText(
            $("#end-slides-h"),
            `Slides: ${deck?.name || ""}${drawn ? ` (drawings on ${drawn} page${drawn === 1 ? "" : "s"})` : ""}`,
          );
          setText(
            $("#end-sl-dl-t"),
            office || !drawn ? "Download a copy" : "Download with my drawings",
          );
          $("#end-board").classList.toggle("hidden", !used);
          setText(
            $("#end-board-h"),
            `Whiteboard (${used} page${used === 1 ? "" : "s"})`,
          );
          $all("#end-dlg input[type=checkbox]").forEach(
            (c) => (c.checked = false),
          );
          setText(
            $("#end-note"),
            hasDeck || used
              ? "Anything you don't keep is deleted when the lecture ends."
              : "",
          );
          $("#end-ok").disabled = false;
          dlg.showModal();
        });

        // =============================================================================
        // Never hangs on "Preparing...": after 90 seconds it says so and lets the lecturer try
        // again.
        // =============================================================================
        const inTime = (p, what) =>
          Promise.race([
            p,
            new Promise((_, no) =>
              setTimeout(
                () =>
                  no(
                    new Error(
                      `preparing ${what} took too long (is the internet slow?)`,
                    ),
                  ),
                90000,
              ),
            ),
          ]);

        // =============================================================================
        // True once the lecture has ended (render() checks it).
        // =============================================================================
        var endDone = false;
        $("#end-dlg").addEventListener("cancel", (e) => {
          if (endDone || $("#end-ok").disabled) e.preventDefault();
        });

        // =============================================================================
        // Goes to the attendance sheet after the lecture.
        // =============================================================================
        const goToSheet = () =>
          window.Curtain
            ? Curtain.go(`attendance.html?course=${course.code}`, {
                dir: "back",
              })
            : (location.href = `attendance.html?course=${course.code}`);

        // =============================================================================
        // Ends the lecture: prepares the chosen files (slides with drawings, whiteboard),
        // shares the ones the lecturer ticked with the class, deletes the slides from storage,
        // ends the session, and offers the files for download.
        // =============================================================================
        $("#end-ok").addEventListener("click", async (e) => {
          e.preventDefault();
          if (endDone) {
            $("#end-dlg").close();
            return goToSheet();
          }
          $("#end-ok").disabled = true;
          $("#end-cancel").disabled = true;
          setText($("#end-ok"), "Working…");
          // True when a choice is ticked and visible.
          const want = (id) => $(id).checked && !$(id).closest(".hidden");
          const ready = [];
          try {
            Files.pdfWriter().catch(() => {});
            if (want("#end-sl-dl") || want("#end-sl-share")) {
              setText($("#end-note"), "Preparing the slides…");
              const office = deck?.kind === "office";
              const blob = await inTime(
                office
                  ? fetch(await API.deckURL(deck.path)).then((r) => r.blob())
                  : deckWithInk(),
                "the slides",
              );
              const name = office
                ? deck.name
                : (deck.name || "Slides").replace(/\.\w+$/, "") +
                  (pagesWithInk() ? " (with notes)" : "") +
                  ".pdf";
              if (want("#end-sl-dl"))
                ready.push([
                  pagesWithInk() && !office
                    ? "Slides with your drawings"
                    : "Slides",
                  blob,
                  name,
                ]);
              if (want("#end-sl-share")) {
                setText($("#end-note"), "Sharing the slides with the class…");
                await API.addMaterial(course.id, sid, {
                  title: `${lectureName()}: slides`,
                  kind: "slides",
                  blob,
                  fileName: name,
                });
              }
            }
            if (want("#end-bd-dl") || want("#end-bd-share")) {
              setText($("#end-note"), "Preparing the whiteboard…");
              const blob = await inTime(boardPDF(), "the whiteboard"),
                name = `${lectureName()} - whiteboard.pdf`;
              if (want("#end-bd-dl")) ready.push(["Whiteboard", blob, name]);
              if (want("#end-bd-share")) {
                setText(
                  $("#end-note"),
                  "Sharing the whiteboard with the class…",
                );
                await API.addMaterial(course.id, sid, {
                  title: `${lectureName()}: whiteboard`,
                  kind: "board",
                  blob,
                  fileName: name,
                });
              }
            }
          } catch (err) {
            setText(
              $("#end-note"),
              "Couldn't save: " +
                (err.message || err) +
                ". The lecture is still on; try again.",
            );
            $("#end-ok").disabled = false;
            $("#end-cancel").disabled = false;
            setText($("#end-ok"), "End lecture");
            return;
          }
          setText($("#end-note"), "Ending the lecture…");
          await API.removeDeck({ ...deckSession, endedAt: 1 }).catch(() => {});
          await API.endSession(sid);
          try {
            localStorage.removeItem(INK_KEY);
          } catch (e) {}
          if (!ready.length) {
            $("#end-dlg").close();
            return goToSheet();
          }
          endDone = true;
          $all("#end-slides, #end-board").forEach((x) =>
            x.classList.add("hidden"),
          );
          setText($("#end-h"), "Lecture ended");
          setText(
            $("#end-note"),
            `Save your file${ready.length > 1 ? "s" : ""}:`,
          );
          $("#end-files").classList.remove("hidden");
          $("#end-files").innerHTML = ready
            .map(
              ([label, , name], i) =>
                `<a class="btn btn-hl" style="justify-content:flex-start" data-file="${i}" download="${esc(name)}">${icon("download", 16)} ${esc(label)} <span class="small" style="opacity:.7;margin-left:auto">PDF</span></a>`,
            )
            .join("");
          ready.forEach(
            ([, blob], i) =>
              ($(`#end-files [data-file="${i}"]`).href =
                URL.createObjectURL(blob)),
          );
          $("#end-cancel").classList.add("hidden");
          setText($("#end-ok"), "Go to the attendance sheet");
          $("#end-ok").disabled = false;
        });
        $("#end-cancel").addEventListener("click", (e) => {
          e.preventDefault();
          $("#end-dlg").close();
          $("#end-cancel").disabled = false;
        });
      })();
    </script>
    <span id="page-end" hidden></span>
  </body>
</html>
