<!doctype html>
<!-- =============================================================================
     The student's home page: a greeting, a live lecture to join right now (if there is
     one), the student's courses as books on a shelf, what comes next, and a form to join
     a new course with its code.
     ============================================================================= -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="supported-color-schemes" content="light dark" />
    <meta name="theme-color" content="#F3F0E8" />
    <meta name="darkreader-lock" />
    <title>Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&family=Heebo:wght@400;500;600;700;800;900&family=Frank+Ruhl+Libre:wght@400;500;700&display=swap"
    />
    <link rel="stylesheet" href="../css/style.css?v=7.0" />
    <script src="../js/i18n-strings.js?v=7.0"></script>
    <script src="../js/i18n.js?v=7.0"></script>
    <link rel="expect" href="#page-end" blocking="render" />
  </head>
  <body>
    <script>
      // =============================================================================
      // Runs before anything is drawn. When the person arrives from (or goes into) the live
      // room, the curtain sheet is still covering the screen, so it is put back right away
      // and the page never flashes in between. See js/curtain.js.
      // =============================================================================
      try {
        var cpO = JSON.parse(sessionStorage.getItem("cp.curtain") || "null"),
          cpN = (performance.getEntriesByType("navigation")[0] || {}).type,
          cpD = document.body.classList.contains("dark-screen");
        sessionStorage.removeItem("cp.curtain");
        if (
          !cpO &&
          cpN === "back_forward" &&
          cpD !== (sessionStorage.getItem("cp.fromDark") === "1")
        )
          cpO = { dir: "back", color: "blue" };
        if (cpO) {
          var cpC = document.createElement("div");
          cpC.className =
            "curtain " +
            (cpO.color === "ink" ? "ink" : "blue") +
            (cpO.dir === "back" ? " edge-left" : " edge-right");
          cpC.setAttribute("aria-hidden", "true");
          cpC.dataset.dir = cpO.dir;
          cpC.dataset.mode = "slide";
          document.body.prepend(cpC);
        }
      } catch (e) {}
    </script>
    <div class="phone">
      <main class="phone-main">
        <header class="page-head">
          <div>
            <span class="kicker" id="today">&nbsp;</span>
            <h1 class="page-title" id="hello" dir="auto" data-tr>Hi.</h1>
          </div>
          <div class="head-stats">
            <div>
              <div class="label">Attendance</div>
              <div class="v" id="st-att">&ndash;</div>
            </div>
            <div>
              <div class="label">Courses</div>
              <div class="v" id="st-n">&ndash;</div>
            </div>
          </div>
        </header>

        <section id="live-card" aria-live="polite"></section>

        <section
          id="my-shelf"
          aria-labelledby="shelf-h"
          style="scroll-margin-top: 24px"
        >
          <div
            class="row"
            style="
              justify-content: space-between;
              align-items: baseline;
              border-bottom: 2px solid var(--ink);
              padding-bottom: 12px;
              flex-wrap: wrap;
            "
          >
            <h2
              id="shelf-h"
              class="section-title"
              style="font-size: clamp(40px, 4.4vw, 60px); line-height: 0.9"
            >
              My <span class="serif">shelf</span>
            </h2>
            <span class="mono muted">Tap a book to bring it forward</span>
          </div>
          <section
            class="shelf"
            id="shelf"
            tabindex="0"
            aria-roledescription="carousel"
            aria-label="My courses"
          ></section>
          <div class="shelf-bar">
            <div class="shelf-nav" style="direction: ltr">
              <button
                class="round-btn"
                id="prev"
                aria-label="Previous course"
              ></button>
              <span
                class="shelf-pos"
                id="pos"
                aria-live="polite"
                dir="ltr"
              ></span>
              <button
                class="round-btn fill"
                id="next"
                aria-label="Next course"
              ></button>
            </div>
            <div class="focus-panel" id="panel"></div>
          </div>
          <p
            class="small hidden"
            id="join-msg"
            role="status"
            style="margin-top: 12px"
          ></p>
        </section>

        <section aria-labelledby="next-h">
          <h2
            id="next-h"
            class="sx-title"
            style="
              font-size: 30px;
              font-weight: 800;
              letter-spacing: -0.04em;
              border-bottom: 1px solid var(--ink);
              padding-bottom: 10px;
            "
          >
            Up <span class="serif">next</span>
          </h2>
          <div id="next-list"></div>
        </section>
      </main>
    </div>
    <div class="page-fade" id="fade"></div>

    <script src="../js/config.js?v=7.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/api-supabase.js?v=7.0"></script>
    <script src="../js/ui.js?v=7.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
    <script src="../js/curtain.js?v=7.0"></script>
    <script src="../js/motion.js?v=7.0"></script>
    <script src="../js/shelf.js?v=7.0"></script>
    <script>
      // =============================================================================
      // The student home page's code.
      // =============================================================================
      (async () => {
        const me = requireRole("student");
        renderStudentNav("today");

        // =============================================================================
        // The student's first name, for the greeting.
        // =============================================================================
        const first = me.name.split(" ")[0];
        setText(
          $("#today"),
          new Date()
            .toLocaleDateString("en-GB", {
              weekday: "long",
              day: "numeric",
              month: "long",
            })
            .replace(",", " ·"),
        );
        $("#hello").innerHTML =
          `${window.I18N ? I18N.t("Hi,") : "Hi,"} <span class="serif"><span class="hl">${esc(first)}.</span></span>`;

        // =============================================================================
        // One day in milliseconds, and the start of the day of a time.
        // =============================================================================
        const DAY = 864e5,
          dayStart = (t) => new Date(new Date(t).toDateString()).getTime();

        // =============================================================================
        // A friendly word for a date: Today, Tomorrow, the weekday, or the date.
        // =============================================================================
        const whenWord = (t) => {
          const d = Math.round((dayStart(t) - dayStart(Date.now())) / DAY);
          return d === 0
            ? "Today"
            : d === 1
              ? "Tomorrow"
              : d < 7
                ? new Date(t).toLocaleDateString("en-GB", { weekday: "long" })
                : fmtDate(t);
        };

        // =============================================================================
        // A lecture time as "Sun · 10:00".
        // =============================================================================
        const slot = (t) =>
          new Date(t).toLocaleDateString("en-GB", { weekday: "short" }) +
          " · " +
          new Date(t).toTimeString().slice(0, 5);

        // =============================================================================
        // Draws the numbers at the top (courses, attendance %), the live lecture card, and the
        // "up next" list.
        // =============================================================================
        function draw({ mine, live, pct }) {
          setText($("#st-n"), pad2(mine.length));
          setText($("#st-att"), pct == null ? "–" : pct + "%");
          if (live) {
            const { c, s, rec } = live;
            const second =
              s.recheck &&
              s.recheck.startedAt &&
              API.now() < s.recheck.startedAt + s.recheck.window * 1000;
            const done = second ? rec.check2 : rec.check1;
            const head = `<span class="pulse-dot"></span><span class="mono">Live now · Lecture ${pad2(s.number)} · since ${fmtTime(s.startedAt).slice(0, 5)}</span>`;
            setHTML(
              $("#live-card"),
              `<div class="live-banner ${done ? "done" : ""}">
        <div class="row" style="gap:14px">${head}</div>
        <h2 dir="auto">${titleHTML(c.name)}</h2>
        ${
          done
            ? `<span class="mono" style="color:var(--hl)">✓ ${second ? "Second check done" : "You're checked in"}</span>`
            : s.checkin === "open"
              ? `<a class="check-btn" href="scan.html?course=${c.code}">${second ? "Second check" : "Check in"}<i>${icon("scan", 18)}</i></a>`
              : `<span class="mono" style="opacity:.85">${s.checkin === "paused" ? "Attendance paused · it opens again soon" : "Attendance opens when your lecturer starts it"}</span>`
        }
      </div>`,
            );
          } else if (arguments[0].early) {
            setHTML(
              $("#live-card"),
              `<div class="skeleton" style="height:96px;border-radius:26px"></div>`,
            );
          } else {
            setHTML(
              $("#live-card"),
              `<div class="live-banner quiet">
        <span class="mono">Nothing live</span>
        <h2>${mine.length ? `No lecture <span class="serif">is live right now.</span>` : `Join <span class="serif">your first course.</span>`}</h2>
        <span class="small muted">${mine.length ? "When your lecturer opens check-in, it shows up here." : "Type the code from your lecturer on the blank book below."}</span>
      </div>`,
            );
          }
          const liveIds = new Set(live ? [live.c.id] : []);
          const list = mine.map((c, i) => ({
            ...c,
            live: liveIds.has(c.id),
            cover: c.cover ?? i,
          }));
          shelf.set(list);
          sideCourses(list);
          const next = mine
            .filter((c) => c.next)
            .sort((a, b) => a.next.at - b.next.at)
            .slice(0, 5);
          setHTML(
            $("#next-list"),
            next.length
              ? next
                  .map(
                    (c) => `
      <a class="list-row" href="course.html?course=${c.code}">
        <span class="mono" style="font-size:12px">${slot(c.next.at)}</span>
        <span class="t" dir="auto">${esc(c.name)} <span class="serif">· ${esc(c.next.title.toLowerCase().startsWith("lecture") ? "lecture " + pad2(c.next.number) : c.next.title)}</span></span>
        <span class="mono muted" style="font-size:10px">${whenWord(c.next.at)}</span>
      </a>`,
                  )
                  .join("")
              : `<p class="serif muted" style="font-size:22px; padding:16px 0">Nothing planned yet.</p>`,
          );
        }

        // =============================================================================
        // Changes the panel beside the shelf; when a different book came to the front it
        // cross-fades.
        // =============================================================================
        const swapPanel = (el, html, changed) => {
          if (el._h === html) return;
          el._h = html;
          el.innerHTML = html;
          if (changed) {
            el.classList.remove("swap");
            void el.offsetWidth;
            el.classList.add("swap");
          }
        };
        $("#prev").innerHTML =
          `<span style="display:flex">${icon("back", 18, "currentColor", 2.2)}</span>`;
        $("#next").innerHTML =
          `<span style="display:flex;transform:rotate(180deg)">${icon("back", 18, "currentColor", 2.2)}</span>`;

        // =============================================================================
        // The shelf of the student's courses. The panel beside it shows the course in front:
        // when it meets, the student's attendance in it, and a button to open it. The last
        // book is the "join a course" form.
        // =============================================================================
        const shelf = Shelf.create({
          root: $("#shelf"),
          prev: $("#prev"),
          next: $("#next"),
          pos: $("#pos"),
          fade: $("#fade"),
          storeKey: "cp.shelf.stu",
          extra: {
            label: "Add a book: join a course",
            a: "Add a",
            b: "book",
            hint: "Join with a code",
          },
          footOf: (c) =>
            [
              scheduleText(c, { short: true }),
              c.held ? `${c.held} lecture${c.held === 1 ? "" : "s"}` : "",
            ]
              .filter(Boolean)
              .join(" · "),
          hrefOf: (c) => `course.html?course=${c.code}`,
          onExtra: () => $("#joincode")?.focus(),
          onActive: (c, i, changed) => {
            if (!c) {
              swapPanel(
                $("#panel"),
                `<form class="focus-form" id="join-form">
            <label for="joincode" style="font-size:18px;font-weight:700;align-self:center">Course code</label>
            <div class="row" style="gap:8px;flex:1 1 240px">
              <input id="joincode" class="input code-input" dir="ltr" maxlength="6" placeholder="ABC123" autocomplete="off" style="flex:1;min-width:0;height:48px">
              <button class="btn btn-primary" style="min-height:48px">Join</button>
            </div></form>`,
                changed,
              );
              return;
            }
            swapPanel(
              $("#panel"),
              `
        <div style="min-width:0"><div style="font-size:22px;font-weight:800;letter-spacing:-0.03em" dir="auto">${titleHTML(c.name)}</div>
          <div class="mono muted" style="font-size:10px;margin-top:4px">${[scheduleText(c), c.held ? c.held + " lectures" : "", c.code].filter(Boolean).map(esc).join(" · ")}</div></div>
        <div class="focus-actions">
          ${c.live ? `<a class="btn btn-accent" href="scan.html?course=${c.code}">Check in</a>` : ""}
          <button class="btn btn-primary" data-act="open">Open course</button>
        </div>`,
              changed,
            );
          },
        });
        $("#panel").addEventListener("click", (e) => {
          if (e.target.closest("[data-act=open]")) shelf.open();
        });

        // =============================================================================
        // Each refresh asks about every course, and the whole class does it, so the slow parts
        // (the course list and attendance) are only fetched every 30 seconds, while "is a
        // lecture live?" (the part that cannot wait) is checked every 4 seconds.
        // =============================================================================
        let busy = false,
          mine = null,
          atts = null,
          slowAt = 0;

        // =============================================================================
        // Refreshes the page: the live lecture often, the courses and attendance less often.
        // =============================================================================
        async function render() {
          if (busy) return;
          busy = true;
          try {
            const slow = !mine || Date.now() - slowAt > 30000;
            if (slow) {
              mine = await Promise.all(
                (await API.myCourses(me.email)).map(API.view),
              );
              if (!cacheGet("stu-home"))
                draw({ mine, live: null, pct: null, early: true });
            }
            const [actives, attsNow] = await Promise.all([
              Promise.all(mine.map((c) => API.activeSession(c.id))),
              slow
                ? Promise.all(
                    mine.map((c) =>
                      API.myAttendance(c.id, me.email).catch(() => []),
                    ),
                  )
                : atts,
            ]);
            if (slow) {
              atts = attsNow;
              slowAt = Date.now();
            }
            const i = actives.findIndex(Boolean);
            const live =
              i >= 0
                ? {
                    c: mine[i],
                    s: actives[i],
                    rec: await API.myRecord(actives[i].id, me.email),
                  }
                : null;
            const rows = atts.flat().filter(Boolean);
            const pct = rows.length
              ? Math.round(
                  (rows.reduce(
                    (n, r) =>
                      n + (r.status === "P" ? 1 : r.status === "H" ? 0.5 : 0),
                    0,
                  ) /
                    rows.length) *
                    100,
                )
              : null;
            const data = { mine, live, pct };
            cacheSet("stu-home", data);
            draw(data);
          } finally {
            busy = false;
          }
        }

        // =============================================================================
        // Shows what this tab saw last time straight away, then loads fresh data, and keeps
        // refreshing.
        // =============================================================================
        const cached = cacheGet("stu-home");
        if (cached) {
          draw(cached);
          bootDone();
        }
        render();
        API.onChange(render, 4000);

        // =============================================================================
        // Joins a course with its code. If the student is not on the list yet, the lecturer
        // gets a join request.
        // =============================================================================
        $("#panel").addEventListener("submit", async (e) => {
          if (e.target.id !== "join-form") return;
          e.preventDefault();
          const res = await API.joinCourse(
            $("#joincode").value,
            me.email,
            me.name,
          );
          const msg = {
            not_found: [
              "No course with this code. Check it and try again.",
              "var(--red)",
            ],
            already: [`You're already in ${res.course?.name}.`, "var(--muted)"],
            joined: [
              `Joined ${res.course?.name}. It's on your shelf.`,
              "var(--blue)",
            ],
            request: [
              `Your Google email isn't on the list for ${res.course?.name}. We sent a request to the lecturer.`,
              "var(--ink-2)",
            ],
            already_requested: [
              `Waiting for the lecturer to approve you in ${res.course?.name}.`,
              "var(--muted)",
            ],
          }[res.status] || ["Please sign in again.", "var(--red)"];
          setText($("#join-msg"), msg[0]);
          $("#join-msg").style.color = msg[1];
          $("#join-msg").classList.remove("hidden");
          if (res.status === "joined") {
            $("#joincode").value = "";
            slowAt = 0;
            render();
          }
        });
      })();
    </script>
    <span id="page-end" hidden></span>
  </body>
</html>
